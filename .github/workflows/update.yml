name: Update market data

on:
  schedule:
    # Weekdays after the US close: 21:45 UTC (4:45pm ET in winter, 5:45pm ET in summer).
    - cron: "45 21 * * 1-5"
    # Backup: GitHub cron often runs hours late (or skips); 00:15 UTC Tue-Sat lands before
    # 10:45am Adelaide. Fails (no commit) rather than writing stale data.
    - cron: "15 0 * * 2-6"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: market-data
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Pinned: versions from the last good run (2026-11-11). Bump deliberately.
      - run: pip install "yfinance==1.8.0" "pandas==3.1.1"
      - run: python scripts/build_market_json.py
      - name: Commit market.json
        run: |
          git config user.name "market-data-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add market.json market_compact.json
          if git diff --cached --quiet; then echo "No change"; exit 0; fi
          git commit -m "Update market data $(date -u +%Y-%m-%d)"
          git push
