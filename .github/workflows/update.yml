name: Update market data

on:
  schedule:
    # Weekdays after the US close: 21:45 UTC (4:45pm ET in winter, 5:45pm ET in summer).
    - cron: "45 21 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: market-data
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --upgrade yfinance pandas
      - run: python scripts/build_market_json.py
      - name: Commit market.json
        run: |
          git config user.name "market-data-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add market.json
          if git diff --cached --quiet; then echo "No change"; exit 0; fi
          git commit -m "Update market data $(date -u +%Y-%m-%d)"
          git push
